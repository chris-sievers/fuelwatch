name: contract

# Real-provider contract tests with their own keys. Only scheduled and manual
# runs exist, so a pull request (forked or not) can never reach these secrets.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract
  cancel-in-progress: false

jobs:
  contract:
    name: contract
    runs-on: ubuntu-24.04
    # The AIS session can take up to 7 minutes, and transient failures rerun.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'

      - name: Contract tests
        env:
          FW_CONTRACT: "1"
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        # Failed tests rerun up to twice, a minute apart, but only on transient
        # errors: an EIA 5xx or transport error, or an AIS timeout, dropped
        # connection or 5xx handshake. Assertion failures, 4xx responses and
        # bad JSON never rerun, so a real format change still fails the run.
        run: >-
          .venv/bin/pytest tests/contract
          --reruns 2 --reruns-delay 60
          --only-rerun '^ProviderError: 5[0-9][0-9] from '
          --only-rerun '^ProviderError: [A-Za-z]+ calling '
          --only-rerun '^TimeoutError\b'
          --only-rerun '^ConnectionClosedError\b'
          --only-rerun '^ConnectionResetError\b'
          --only-rerun '^InvalidStatus: .*HTTP 5[0-9][0-9]'

  report-failure:
    name: report-failure
    needs: contract
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The only job allowed to write issues; it checks out nothing and holds
    # no provider keys.
    permissions:
      issues: write
    steps:
      - name: Open or update the contract-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create contract-failure --color B60205 \
            --description "Nightly contract tests failed" --force
          existing=$(gh issue list --label contract-failure --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          body="Contract tests failed on $(date -u +%Y-%m-%d): $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Contract tests failing" \
              --label contract-failure \
              --body "$body

          A provider may have changed its format, or a contract key may have expired. Later failures are added here as comments until this issue is closed."
          fi
