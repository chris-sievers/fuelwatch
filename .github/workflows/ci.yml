name: ci

# Runs on every pull request and every push to main. Never uses
# pull_request_target and never reads a secret, so a forked pull request
# gets nothing it could leak. The weekly scheduled run on main is the one
# where gitleaks scans the whole history (pull request and push runs scan
# only their own commits), and it lets pip-audit catch newly published
# advisories while main is unchanged.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC

permissions:
  contents: read

# One group per PR, or per event and ref otherwise, so a scheduled run and a
# push to main never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools
          .venv/bin/python -m pip install -e '.[dev]' pip-audit
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Unit tests
        # Tests marked contract skip themselves unless FW_CONTRACT=1.
        run: pytest

      - name: Audit installed dependencies
        # The project itself is installed editable and is not on PyPI.
        run: pip-audit --skip-editable

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Used only for read-only API calls; no license is needed on a
          # personal account. PR comments are off so the token stays read-only.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Download actionlint
        id: get_actionlint
        # Download script pinned to the v1.7.12 commit, binary version pinned too.
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
        shell: bash

      - name: Lint workflows
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

      # Still to come from the spec's ci row: the Trivy scan and the unpushed
      # test build arrive with the Dockerfile.

  ui:
    # Headless Chromium against the app in demo mode, with the app's real
    # Content-Security-Policy enforced (tests/ui). Screenshots are uploaded
    # as the "ui-screenshots" artifact, pass or fail.
    name: ui
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies and Chromium
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools
          .venv/bin/python -m pip install -e '.[dev,ui]'
          .venv/bin/python -m playwright install --with-deps chromium
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: UI tests
        env:
          FW_UI: "1"
        run: pytest tests/ui -v

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-screenshots
          path: tests/ui/artifacts/
          if-no-files-found: error
          retention-days: 30
